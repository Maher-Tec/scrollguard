name: scrollguard
description: "ScrollGuard - Mindful social media intervention for digital wellness"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.8.1
  
  # Local Storage
  shared_preferences: ^2.3.5
  
  # Typography
  google_fonts: ^6.2.1
  
  # Animations
  flutter_animate: ^4.5.2
  
  # Haptic Feedback
  vibration: ^2.0.1
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Audio for calming sounds
  just_audio: ^0.9.43
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # Code generation for Riverpod
  riverpod_generator: ^2.6.5
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F1419" # Matches app background color
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  
  # Assets will be added as needed
  assets:
     - assets/icon/

